# Готический стиль техножрецов на русском — включается флагом -lang=ruwah40k или KTAN_LANG=ruwah40k.

[common]
err_prefix = "ОШИБКА: дух машины ропщет — "

[topics]
title = "ktan — Дата-кантикулы Омниссии ({count})"
loading = "Воззываем к архивам... ++дух машины пробуждается++"
no_topics = "Архивы безмолвны. Информационные скрижали не обретены."
line = "{name} ({partitions} священных каналов, {messages} дата-кантикулов)"
help = "↑/↓ воззвание • enter призыв • r повторный обряд • ctrl+c разорвать связь"

[messages]
title = "ktan — Кантикулы «{topic}» (последние {tail})"
loading = "Пробуждение духа машины..."
no_messages = "Безмолвие. Дата-кантикулы не запечатлены."
help = "↑/↓ воззвание • enter воззреть • r повторный обряд • esc отступление • ctrl+c разорвать связь"

[message]
title = "ktan — «{topic}» канал {partition} кантикула {offset}"
timestamp = "момент начертания"
key = "сигила"
value = "информационная скрижаль"
value_json = "информационная скрижаль (машинная вязь)"
help = "↑/↓ свиток начертания • esc отступление • ctrl+c разорвать связь"
